actualidad: >-
  Verificado el {verificado}. El Decreto 1186 de 2025 (Diario Oficial 53.300 del
  10 de noviembre) creó la Licencia Ambiental Eólica con Diseño Optimizado
  (LAEólica), diseñada específicamente para destrabar proyectos eólicos. El
  Decreto 1540 de 2024 (Diario Oficial 52.976 del 20 de diciembre) reglamentó la
  gobernanza con participación étnica de las transferencias del sector eléctrico
  en territorios con mayor recurso solar y eólico, en desarrollo del artículo 233
  de la Ley 2294 de 2023. La Resolución MADS 418 de 2026 (Diario Oficial 53.483
  del 7 de mayo) adoptó los términos de referencia del EIA para geotermia, y las
  Resoluciones CREG 174 de 2021 y 701 091 de 2025 ordenan la autogeneración
  distribuida y remota, base de las comunidades energéticas.
