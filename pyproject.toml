[project]
name = "renovable"
version = "0.1.0"
description = "Informe ejecutivo de energías renovables en Colombia para la Cancillería (MinMinas)"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
    { name = "Oficina de Asuntos Regulatorios y Empresariales (OARE)", email = "menergia@minenergia.gov.co" },
]
maintainers = [
    { name = "Oficina de Asuntos Regulatorios y Empresariales (OARE)" },
]
keywords = [
    "energia",
    "renovables",
    "Colombia",
    "regulacion",
    "CREG",
    "XM",
    "cancilleria",
    "informe",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Spanish",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "jinja2>=3.1.0",
    "plotly>=5.20,<6",
    "kaleido==0.2.1",
    "weasyprint>=60.0",
    "pandas>=2.2",
    "psycopg[binary]>=3.1",
    "pyyaml>=6.0",
    "pydantic-settings>=2.3",
    "requests>=2.31",
]

[project.scripts]
renovable = "renovable.controllers.cli.main:main"

[project.urls]
"Oficina de Asuntos Regulatorios y Empresariales" = "https://www.minenergia.gov.co/es/ministerio/estructura-organizacional/organigrama-interactivo/oficina-asuntos-regulatorios-y-empresariales/"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
    "pypdf>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/renovable"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "build", "output"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
