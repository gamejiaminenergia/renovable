        titulo: "Proyecto"
        alineacion: left
      - clave: tecnologia
        titulo: "Tecnología"
        alineacion: left
      - clave: capacidad_mw
        titulo: "Capacidad (MW)"
      - clave: municipio
        titulo: "Municipio"
        alineacion: left
      - clave: departamento
        titulo: "Departamento"
        alineacion: left
      - clave: confianza
        titulo: "Confianza"
        alineacion: left
    formatos:
      capacidad_mw: decimal
  - id: tabla_top_proyectos
    consulta: q04_proyectos_renovables_detalle
    titulo: "Proyectos renovables de más de 50 MW"
    fuente: "q04_proyectos_renovables_detalle (XM/SIN, elecdb)"
    metodo: "Capacidad efectiva neta máxima y generación por recurso; umbral 50 MW"
    orden: capacidad_mw
    descendente: true
    limite: 13
    columnas:
      - clave: proyecto
        titulo: "Proyecto"
        alineacion: left
      - clave: fuente
        titulo: "Fuente"
        alineacion: left
      - clave: capacidad_mw
        titulo: "Capacidad (MW)"
      - clave: gen_2026_gwh
