actualidad: >-
  Actualidad verificada con el asistente CREG y contrastada contra el gestor
  normativo el {verificado}. Las novedades de 2026 son: la Resolución CREG
  101 104 (Diario Oficial 53.470 del 23 de abril) normaliza las plantas solares
  del SDL que pasaron a pruebas y ajusta las Resoluciones CREG 060 de 2019,
  148 de 2021 y 101 011 de 2022; la Resolución CREG 101 113 (Diario Oficial
  53.530 del 22 de junio) incorpora los sistemas de almacenamiento con baterías
  al SIN; la Resolución CREG 701 126 autoriza de forma transitoria la entrega de
  excedentes de generación; y la Resolución CREG 701 133 ajusta la vigencia de la
  aprobación de conexión de la capacidad asignada. En el frente de política, el
  CONPES 4075 de 2022 y el artículo 233 de la Ley 2294 de 2023 fijan la ruta de
  transición y las transferencias a territorios con mayor recurso solar y eólico.
  La agenda regulatoria 2026 de la CREG tiene en trámite la modernización del
  mercado mayorista, la remuneración de la distribución y comercialización, las
  subastas de energía firme y la armonización de comunidades energéticas.
