conclusion: >-
  El diferencial entre bolsa y contratos remunera la estabilidad; para la
  diplomacia energética, la existencia de contratos de largo plazo a
  {precio_contratos_cop_kwh} COP/kWh es un argumento de bancabilidad.
tip: >-
  Al negociar con banca multilateral, use el precio de contratos y no el de
  bolsa como referencia de ingresos: el segundo sobrerreacciona al ciclo
  hidrológico.
advertencia: >-
  La prima de bolsa sobre contratos puede revertirse con un año húmedo; no
  proyecte los precios de 2026 como línea base permanente.
metodo: >-
  Consultas q07 y q11 sobre fact_daily_sistema y fact_monthly_sistema, más
  referencias internacionales de costos.
fuentes:
