actualidad: >-
  Verificado el {verificado}. El mecanismo de contratación de largo plazo vigente
  fue convocado por la Resolución MME 40208 de 2026 (Diario Oficial 53.471 del
  24 de abril) y sus condiciones de competencia, garantía de puesta en operación
  y fórmula de traslado al usuario regulado quedaron definidas por la Resolución
  CREG 701 125 de 2026. Para el financiamiento, el Decreto 1223 de 2025
  (Diario Oficial 53.308 del 18 de noviembre) actualizó la línea de crédito de
  redescuento con tasa compensada para proyectos de generación, transmisión y
  almacenamiento. La asignación de capacidad de transporte se mantiene bajo la
  Resolución CREG 075 de 2021 y los lineamientos de la Resolución MME 40311 de 2020.
