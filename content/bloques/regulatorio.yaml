conclusion: >-
  El marco está maduro para habilitar proyectos; el cuello de botella regulatorio
  se desplazó a la ejecución: conexión, capacidad de transmisión y tiempos de
  licenciamiento.
tip: >-
  En diálogos bilaterales, enfatice la estabilidad del régimen de la Ley 1715 y
  su continuidad con la Ley 2099 como activo de seguridad jurídica.
advertencia: >-
  La CREG expide resoluciones de forma continua; este capítulo refleja el estado
  a la fecha de corte y debe revalidarse antes de cada presentación oficial.
metodo: >-
  Doce consultas temáticas al asistente normativo de la CREG archivadas como
  evidencia y contrastadas con el gestor normativo y las resoluciones de la UPME.
