# Georreferenciación de los proyectos renovables del SIN.
#
# El municipio de cada planta se toma del registro oficial "Meta FNCER"
# (datos.gov.co, dataset vy9n-w6hc, Ministerio de Minas y Energía) y se
# contrasta con la capacidad reportada por XM en elecdb. Las coordenadas NO son
# la ubicación exacta de la planta: son el centroide municipal del DIVIPOLA
# (temporal.geo_municipios). La ubicación precisa de cada proyecto está en el
# registro de proyectos de generación de la UPME (Resolución UPME 749 de 2025).
#
# confianza: alta  = nombre y capacidad coinciden con el registro oficial
#            media = nombre coincide pero la capacidad difiere o hay varias fases
proyectos:
  - nombre: "PARQUE SOLAR PUERTA DE ORO"
    tecnologia: "Solar FV"
    capacidad_mw: 300.0
    municipio: "GUADUAS"
    departamento: "CUNDINAMARCA"
    codigo_municipio: "25320"
    confianza: "alta"
    evidencia: "Meta FNCER: Puerta de Oro Fase 1 (120 MW) + Fase 2 (180 MW)"
