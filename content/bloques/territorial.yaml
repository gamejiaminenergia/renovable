id: territorial
tipo: seccion
titulo: "Dimensión socioambiental y territorial"
resumen: >-
  El desarrollo renovable es territorialmente asimétrico: la solar se concentra
  en el Caribe y en el interior, y la eólica depende por completo de La Guajira,
  donde el componente social es determinante.
parrafos:
  - >-
    La flota solar del SIN se ubica principalmente en la región Caribe
    (Atlántico, Bolívar, Cesar, Córdoba y Magdalena) y en los valles del
    interior, donde la radiación es alta y existen nodos de conexión. La
    capacidad se distribuye en un núcleo industrial y una base amplia de
    autogeneración a pequeña escala.
  - >-
    La eólica está confinada a La Guajira. Tres parques suman {cap_eolica_mw} MW
    observados, sobre un territorio con comunidades indígenas y un proceso de
    consulta previa que condiciona los cronogramas. La experiencia regional
    muestra que el éxito de un proyecto eólico se decide tanto en la ingeniería
    como en la mesa social.
  - >-
    Colombia cuenta con un marco específico para comunidades energéticas y
    autogeneración a pequeña escala, pensado para que hogares y pequeños
    usuarios generen y vendan excedentes. Es una vía de equidad territorial y
    también una fuente de demanda de cooperación técnica.
  - >-
    En materia ambiental, la energía solar y eólica desplaza generación térmica y
    reduce el factor de emisión del SIN, hoy en {factor_emision_gco2e_kwh}
    gCO₂e/kWh. Los impactos relevantes se concentran en uso del suelo, avifauna
    en el caso eólico y acceso al agua para limpieza de paneles.
