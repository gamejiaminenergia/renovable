id: financiero
tipo: seccion
titulo: "Dimensión financiera: precios, contratos y costo del capital"
resumen: >-
  El mercado cerró el corte con bolsa en {precio_bolsa_cop_kwh} COP/kWh y
  contratos en {precio_contratos_cop_kwh} COP/kWh: una prima de
  {prima_bolsa_contratos_pct} % que castiga a quien no tiene cobertura.
kpis:
  - precio_bolsa_cop_kwh
  - precio_contratos_cop_kwh
  - prima_bolsa_contratos_pct
  - embalses_pct
  - demanda_gwh
figuras:
  - fig_precios
  - fig_embalses_precios
parrafos:
  - >-
    El precio del mercado está dominado por la hidrología. Entre abril y
    septiembre de {anio} la bolsa pasó de 274 a más de 900 COP/kWh en el pico de
    agosto, mientras los contratos se mantuvieron estables alrededor de
    {precio_contratos_cop_kwh} COP/kWh. La prima de bolsa sobre contrato
    ({prima_bolsa_contratos_pct} %) es la señal de riesgo que enfrentan los
    comercializadores con baja cobertura.
  - >-
    Para un proyecto renovable, esa brecha es una oportunidad y un riesgo. Un
    contrato de largo plazo a precio fijo da bancabilidad y protege al
    inversionista de la volatilidad spot, pero lo obliga a asumir riesgo de
    generación: la solar produce cuando hay sol, no cuando hay precio alto.
  - >-
    En costos de capital, el país converge con los referentes internacionales.
    El costo nivelado de la energía solar a escala utility se ubica en el rango
    bajo de la región y el de la eólica terrestre es competitivo frente a las
    alternativas térmicas, de acuerdo con las series de referencia internacional.
    El punto crítico no es el CAPEX sino el costo financiero y la demora en la
    puesta en operación.
  - >-
    En cargos regulados, la intermediación (MC) se ha mantenido en el orden de
    330 COP/kWh, las contribuciones CEE y CERE alrededor de 65-70 COP/kWh y el
    FAZNI apenas 3,26 COP/kWh. La estructura de cargos es estable y
    predecible, lo que favorece la planeación de largo plazo.
