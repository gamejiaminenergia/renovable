        relevancia: "Reglas de entrega de excedentes al SIN."
      - norma: "Resolución CREG 174 de 2021"
        objeto: "Autogeneración a pequeña escala y generación distribuida"
        relevancia: "Reglas técnicas, comerciales y de vigencia de la conexión."
      - norma: "Resolución CREG 061 de 2015 / 243 de 2016"
        objeto: "Energía firme de plantas eólicas y solares"
