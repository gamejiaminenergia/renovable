    columnas:
      - clave: norma
        titulo: "Norma"
        alineacion: left
      - clave: objeto
        titulo: "Objeto"
        alineacion: left
      - clave: relevancia
        titulo: "Relevancia para el proyecto"
        alineacion: left
    formatos: {}
    filas:
      - norma: "Ley 143 de 1994"
        objeto: "Régimen del servicio público de electricidad"
        relevancia: "Marco general del mercado mayorista."
      - norma: "Ley 1715 de 2014"
        objeto: "Promoción de fuentes no convencionales de energía"
        relevancia: "Crea el régimen de FNCE y los incentivos tributarios y arancelarios."
      - norma: "Ley 2099 de 2021"
        objeto: "Transición energética"
        relevancia: "Amplía incentivos, declara utilidad pública e interés social."
      - norma: "Resolución CREG 024 de 2015"
