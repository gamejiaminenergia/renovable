id: regulatorio
tipo: seccion
titulo: "Dimensión regulatoria: marco y actualidad"
resumen: >-
  Colombia cuenta con un marco normativo completo para las fuentes no
  convencionales; el desafío regulatorio de {anio} ya no es la habilitación sino
  la ejecución de la conexión, los incentivos y la seguridad jurídica.
parrafos:
  - >-
    La Ley 1715 de 2014 creó el régimen de promoción de las fuentes no
    convencionales de energía (FNCE) y la Ley 2099 de 2021 profundizó la
    transición energética: amplió los incentivos tributarios, declaró de utilidad
    pública las actividades de FNCE y reforzó el papel certificador de la UPME.
    Sobre ese marco, la CREG desarrolló las reglas de mercado y de operación.
  - >-
    En el plano operativo, la CREG ha regulado de forma escalonada la
    autogeneración a gran escala, la autogeneración a pequeña escala y la
    generación distribuida, y ha definido metodologías de energía firme para
    plantas solares y eólicas, que son la puerta de entrada al cargo por
    confiabilidad.
  - >-
    La actualidad regulatoria se concentra en tres frentes: la simplificación
    del registro de proyectos de generación ante la UPME, la integración del
    trámite de incentivos tributarios y la asignación de capacidad de
    transmisión. El registro UPME es informativo y voluntario, pero ordena el
    pipeline que el país presenta ante la banca multilateral.
